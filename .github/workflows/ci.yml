name: ci

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: go golangci-lint shellcheck actionlint zizmor gitleaks go:golang.org/x/vuln/cmd/govulncheck
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-check-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-check-
      - name: go mod tidy is clean, retried when a module download drops
        run: |
          for attempt in 1 2 3; do
            go mod tidy -diff && exit 0
            echo "::warning::go mod tidy -diff failed (attempt $attempt); a download may have dropped, retrying"
            sleep 10
          done
          exit 1
      - name: gofmt lists no file
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: golangci-lint run ./...
      - name: go test -race, in random order
        run: go test -race -shuffle=on ./...
      - name: go test on the oldest Go that go.mod allows
        run: GOTOOLCHAIN="go$(go list -m -f '{{.GoVersion}}')" go test ./...
      - name: build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            echo "::group::$target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/bqto
            echo "::endgroup::"
          done
      - name: govulncheck
        run: govulncheck ./...
      - name: shellcheck the scripts
        run: shellcheck scripts/*.sh install.sh
      - name: actionlint the workflows
        run: actionlint
      - name: zizmor the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows
      - name: scan the history with gitleaks
        run: gitleaks git . --redact --no-banner

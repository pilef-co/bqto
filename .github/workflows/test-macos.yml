name: test-macos

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-macos-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-macos:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'test:macos' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: go
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-test-macos-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-test-macos-
      - name: go test -race on macOS, in random order
        run: go test -race -shuffle=on ./...
